<line x1="870" y1="92" x2="660" y2="92" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="765.0" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">pacs.002 / pacs.004</text>
<rect x="410.0" y="210" width="220" height="70" rx="8" fill="#eef2ff" stroke="#3b4fd6" stroke-width="1.5"/>
<text x="520.0" y="239.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">RTGS settlement engine</text>
<text x="520.0" y="258.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">debits A, credits B</text>
