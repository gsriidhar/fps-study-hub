<text x="520.0" y="326" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Clearing (the message exchange above) and settlement (the RTGS leg below) are separate steps, which is why a payment can look confirmed before it is actually settled.</text>
