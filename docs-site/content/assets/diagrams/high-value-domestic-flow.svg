<rect x="20" y="40" width="150" height="80" rx="8" fill="#eef2ff" stroke="#3b4fd6" stroke-width="1.5"/>
<text x="95.0" y="74.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Participant A</text>
<text x="95.0" y="93.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">(sending bank)</text>
