<svg viewBox="0 0 1140 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="arrowend" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L6,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowend-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
  </marker>
</defs>

<rect x="0" y="0" width="1140" height="300" fill="#ffffff"/>
<text x="16" y="24" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Faster Payments — direct vs. indirect access</text>
<rect x="20" y="50" width="190" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="115.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Indirect participant</text>
<text x="115.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">e.g. a fintech or building society</text>
<rect x="290" y="50" width="190" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="385.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Sponsor bank</text>
<text x="385.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">a direct participant acting as agent</text>
<rect x="570" y="50" width="190" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="665.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">FPS central</text>
<text x="665.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">infrastructure</text>
<rect x="900" y="50" width="190" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="995.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Direct participant</text>
<text x="995.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">connects and settles itself</text>
<line x1="210" y1="80.0" x2="290" y2="80.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="250.0" y="72.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">routes traffic</text>
<line x1="290" y1="102.0" x2="210" y2="102.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowend-muted)"/>
<line x1="480" y1="80.0" x2="570" y2="80.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="525.0" y="72.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">settles for it</text>
<line x1="570" y1="102.0" x2="480" y2="102.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowend-muted)"/>
<line x1="900" y1="80.0" x2="760" y2="80.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowend-muted)"/>
<line x1="760" y1="102.0" x2="900" y2="102.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="830.0" y="94.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">connects directly</text>
<text x="570.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Direct membership means connecting to the scheme and settling your own obligations at the central bank. Indirect participants get the same reach through a sponsor&#x27;s direct connection.</text>
</svg>