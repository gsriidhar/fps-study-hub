<svg viewBox="0 0 1110 330" xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="arrowend" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L6,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowend-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
  </marker>
</defs>

<rect x="0" y="0" width="1110" height="330" fill="#ffffff"/>
<text x="16" y="24" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Faster Payments — clearing vs. settlement</text>
<rect x="20" y="50" width="150" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="95.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Payer</text>
<text x="95.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">sends the request</text>
<rect x="260" y="50" width="150" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="335.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Sending bank</text>
<text x="335.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">validates + CoP check</text>
<rect x="480" y="50" width="150" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="555.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">FPS central</text>
<text x="555.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">infrastructure</text>
<rect x="700" y="50" width="150" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="775.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Receiving bank</text>
<text x="775.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">posts the credit</text>
<rect x="940" y="50" width="150" height="80" rx="8" fill="#eef2ff" stroke="#059669" stroke-width="1.5"/>
<text x="1015.0" y="84.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Payee</text>
<text x="1015.0" y="103.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">sees funds land</text>
<line x1="170" y1="74" x2="260" y2="74" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="215.0" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">request sent</text>
<line x1="410" y1="74" x2="480" y2="74" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="445.0" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">pacs.008</text>
<line x1="480" y1="102" x2="410" y2="102" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowend-muted)"/>
<text x="445.0" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">pacs.002</text>
<line x1="630" y1="74" x2="700" y2="74" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="665.0" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">pacs.008</text>
<line x1="700" y1="102" x2="630" y2="102" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowend-muted)"/>
<text x="665.0" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">pacs.002</text>
<line x1="850" y1="74" x2="940" y2="74" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowend)"/>
<text x="895.0" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#059669">credited</text>
<text x="445.0" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669">&#9679; clears in seconds</text>
<rect x="385.0" y="220" width="340" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="555.0" y="249.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Deferred net settlement</text>
<text x="555.0" y="268.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">obligations netted &amp; settled in scheduled cycles across the day</text>
<line x1="335.0" y1="130" x2="385.0" y2="220" stroke="#a7f3d0" stroke-width="1.3" stroke-dasharray="4,4"/>
<line x1="775.0" y1="130" x2="725.0" y2="220" stroke="#a7f3d0" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="555.0" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669">&#9679; happens later, separately from clearing</text>
<text x="555.0" y="316" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Clearing (top) is near-instant; settlement (bottom) is deferred and netted — the gap between the two is why participants carry settlement risk in between.</text>
</svg>