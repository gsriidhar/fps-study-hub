name: Validate docs

on:
  pull_request:
    paths:
      - "data/**"
      - "docs-site/**"
      - "scripts/**"
      - "*.js"
      - "*.html"
      - "*.css"
  push:
    branches: [master]
    paths:
      - "data/**"
      - "docs-site/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: docs-site/requirements.txt

      - name: Regenerate Markdown from lesson data
        run: node scripts/convert-to-markdown.js . docs-site/content

      - name: Fail if generated Markdown is out of sync with committed content
        run: |
          if ! git diff --quiet -- docs-site/content/fps docs-site/content/cpcm docs-site/content/glossary; then
            echo "::error::docs-site/content is out of sync with data/*.js — run 'node scripts/convert-to-markdown.js . docs-site/content' and commit the result."
            git diff --stat -- docs-site/content/fps docs-site/content/cpcm docs-site/content/glossary
            exit 1
          fi

      - name: Lint Markdown
        run: npx --yes markdownlint-cli "docs-site/content/**/*.md" --config docs-site/.markdownlint.json
        continue-on-error: true # style-only; won't block merges, surfaces in the log

      - name: Install MkDocs dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Strict build (fails on broken nav / bad references)
        working-directory: docs-site
        run: mkdocs build --strict

      - name: Check internal links for 404s
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --offline
            --base docs-site/site
            --remap '^https://gsriidhar\.github\.io/fps-study-hub/?(.*)$ docs-site/site/$1'
            --no-progress
            'docs-site/site/**/*.html'
          fail: true

      - name: Validate legacy app JS syntax
        run: |
          node -e "new Function(require('fs').readFileSync('app.js','utf8'))"
          for f in data/*.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" || (echo "::error::Syntax error in $f" && exit 1)
          done
